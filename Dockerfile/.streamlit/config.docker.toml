[server]
headless = true
port = 8501
address = "0.0.0.0"
enableCORS = false
enableXsrfProtection = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"

# Must match dashboard MISSION_CSS (dark). A light theme here made
# secondary nav buttons white-on-white on greineq-agent.sudocod.com.
[theme]
primaryColor = "#f59e0b"
backgroundColor = "#0f172a"
secondaryBackgroundColor = "#1e293b"
textColor = "#e2e8f0"
font = "sans serif"
