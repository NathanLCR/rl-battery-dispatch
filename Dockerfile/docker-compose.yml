services:
  greineq:
    build:
      context: ..
      dockerfile: Dockerfile/Dockerfile
    container_name: greineq-web
    restart: unless-stopped
    ports:
      # Host port → container 8000 (Web Twin). Default 8501 keeps the same public URL mapping.
      - "${GREINEQ_PORT:-8501}:8000"
    volumes:
      # Required (not in git): data/merged_30min_v2.csv, data/day_split.json
      - ../data:/app/data:ro
      - ../artifacts:/app/artifacts
      # Required for Current/Privileged Q: 540/1620-state forecast_exp models
      - ../results:/app/results:ro
    mem_limit: 2g

  nginx:
    image: nginx:1.27-alpine
    container_name: greineq-nginx
    profiles: ["with-nginx"]
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      greineq:
        condition: service_healthy
